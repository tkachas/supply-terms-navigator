[project]
name = "supply-terms-navigator"
version = "0.1.0"
description = "Прототип сверки условий договоров поставки с проверяемыми основаниями"
requires-python = ">=3.10"
dependencies = []          # только стандартная библиотека

[project.scripts]
terms-navigator = "terms_navigator.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["terms_navigator"]

[tool.setuptools.package-data]
terms_navigator = ["static/*"]
